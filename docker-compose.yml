version: '3.8'

services:
  applet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecomind-applet-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
